            Microsoft <span class="acc-soon">Soon</span>
          </button>
        </div>
        <div class="acc-divider">or</div>

      <form id="loginForm" novalidate>
        <p class="acc-error" id="loginError" role="alert"></p>
        <div class="acc-field">
          <label class="acc-label" for="loginEmail">Email</label>
          <input class="acc-input" id="loginEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="acc-field">
          <label class="acc-label" for="loginPassword">Password</label>
          <div class="acc-pw">
            <input class="acc-input" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="acc-pw__toggle" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="acc-row-between">
          <button type="button" class="acc-link-btn" id="forgotBtn" aria-controls="forgotNote">Forgot it?</button>
        </div>
        <p class="acc-notice" id="forgotNote" hidden>No reset emails yet: create a new account. Your study history stays in this browser.</p>
        <button type="submit" class="acc-btn acc-btn--primary acc-btn--block">Sign in</button>
      </form>
      <p class="acc-local"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Saved in this browser for now</p>
    </section>
    </div>
  </main>
  <div class="acc-toast" id="accToast" role="status" aria-live="polite"></div>
</body>
</html>
