    <section class="acc-form-card" aria-labelledby="loginTitle">
      <div class="acc-readout" aria-hidden="true">
        <span class="acc-readout__dot"></span><span id="accClock">--:--</span>
      </div>
      <h2 id="loginTitle">Sign in</h2>
      <p class="acc-form-card__sub" id="loginSub">New here? <a href="signup.html">Create an account</a></p>
      <p class="acc-form-card__sub" id="loginKnown" hidden>Not you? <button type="button" class="acc-link-btn" id="notYou">Use another account</button></p>
      <p class="acc-notice" id="alreadyIn" hidden>Signed in as&nbsp;<strong id="alreadyName"></strong>.&nbsp;<a href="settings.html">Settings</a></p>
        <div class="acc-providers">
          <button type="button" class="acc-btn acc-btn--ghost acc-provider" aria-disabled="true" title="Available when cloud sync is switched on">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
            Google <span class="acc-soon">Soon</span>
          </button>
          <button type="button" class="acc-btn acc-btn--ghost acc-provider" aria-disabled="true" title="Available when cloud sync is switched on">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>
            Microsoft <span class="acc-soon">Soon</span>
          </button>
        </div>
        <div class="acc-divider">or</div>

      <form id="loginForm" novalidate>
        <p class="acc-error" id="loginError" role="alert"></p>
        <div class="acc-field">
          <label class="acc-label" for="loginEmail">Email</label>
          <input class="acc-input" id="loginEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="acc-field">
          <label class="acc-label" for="loginPassword">Password</label>
          <div class="acc-pw">
            <input class="acc-input" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="acc-pw__toggle" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="acc-row-between">
          <button type="button" class="acc-link-btn" id="forgotBtn" aria-controls="forgotNote">Forgot it?</button>
        </div>
        <p class="acc-notice" id="forgotNote" hidden>No reset emails yet: create a new account. Your study history stays in this browser.</p>
        <button type="submit" class="acc-btn acc-btn--primary acc-btn--block">Sign in</button>
      </form>
      <p class="acc-local"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Saved in this browser for now</p>
    </section>
