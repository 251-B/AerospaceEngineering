<!doctype html>
<html lang="en" data-theme="dark" data-surface="default">
<head>
<meta charset="utf-8">
<title>Sideris AI chat harness</title>
<link rel="stylesheet" href="../../assets/css/study-surface.css">
<script>window.AE_SIDERIS_NO_AUTOSTART = true;   // the scenarios set the device themselves</script>
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/ask-ai.js"></script>
</head>
<body>
<main>
  <h1>Topic 4: The Navier-Stokes Equations</h1>
  <article class="problem-card" id="prob-1">
    <h2 class="problem-title">Couette flow</h2>
    <div class="problem-statement-box"><p>Find the velocity profile $u(y)$ between two parallel plates.</p></div>
    <div class="phase-block"><p>The reference result is SECRET_RESULT_42: $u(y) = U y / h$.</p></div>
  </article>
</main>
<pre id="results">PENDING</pre>
<script>
window.addEventListener('load', function () {
  var out = [];
  function check(name, pass, detail) {
    out.push({ name: name, pass: !!pass, detail: detail || '' });
  }
  function finish() {
    document.getElementById('results').textContent = JSON.stringify(out);
  }

  setTimeout(function () {
    try {
      localStorage.clear();
      check('api-loaded', !!(window.AESideris && window.AESiderisEngine && window.AESiderisRAG), 'globals present');
      var btn = document.getElementById('siderisButton');
      var drawer = document.getElementById('siderisDrawer');
      check('launcher-present', !!(btn && drawer && drawer.hidden), 'launcher + hidden drawer');

      // Open drawer & verify all 4 Sideris models (Instant 0 MB by default + optional Offline)
      window.AESideris.open();
      check('drawer-opens', !drawer.hidden && window.AESideris.isOpen(), 'drawer open');
      var names = window.AESideris.models().map(function (m) { return m.name; });
      check('four-sideris-models', names.join(',') === 'Sideris Lux,Sideris Aether,Sideris Orion,Sideris Titan', names.join(','));

      // Model switch persists in ae_sideris
      window.AESideris.selectModel('sideris-lux');
      var stored = JSON.parse(localStorage.getItem('ae_sideris') || '{}');
      check('model-persists', stored.modelId === 'sideris-lux', stored.modelId);
      // Reasoning models only on request: never saved, and a new chat goes back to Lux
      window.AESideris.selectModel('sideris-orion');
      var storedAfter = JSON.parse(localStorage.getItem('ae_sideris') || '{}').modelId;
      var activeNow = window.AESideris.state().model.id;
      window.AESideris.clearChat();
      check('reasoning-model-only-on-request', storedAfter === 'sideris-lux' && activeNow === 'sideris-orion' &&
        window.AESideris.state().model.id === 'sideris-lux', storedAfter + ' / ' + activeNow + ' / ' + window.AESideris.state().model.id);
      window.AESideris.selectModel('sideris-aether');

      // Seed a small RAG shard and test retrieval
      window.AESiderisRAG.setData('fluid-mechanics', {
        subject: 'fluid-mechanics',
        label: 'Fluid Mechanics',
        chunks: [
          { i: 1, u: 4, k: 't', t: 'Topic 4 - The Navier-Stokes Equations', h: 'Couette flow', x: 'For steady incompressible Couette flow between parallel plates, $\\mu \\frac{d^2 u}{dy^2} = 0$, giving $u(y) = U y / h$.' },
          { i: 2, u: 5, k: 't', t: 'Topic 5 - Hydrostatics', h: 'Pressure', x: 'Hydrostatic pressure increases linearly with depth: $p = p_0 + \\rho g z$.' }
        ]
      });

      var lastReq = null;
      window.AESiderisEngine.setMock(function (req, cb) {
        lastReq = req;
        var reply = '<think>Check Couette boundary conditions u(0)=0 and u(h)=U.</think>\n' +
          '### Step 1\nUse the **momentum equation** with $u(0)=0$:\n\n$$\\mu \\frac{d^2 u}{dy^2} = 0$$\n\n' +
          'Raw tag test: <img src=x onerror="window.__xss=1">';
        cb.onToken(reply, reply);
        return Promise.resolve(reply);
      });

      // Test Ask AI Socratic handoff (hidden solution MUST NOT appear in visible DOM!)
      window.AESideris.openWithAskRequest({
        taskLabel: 'Socratic tutor',
        location: 'Problem 1 · Couette flow',
        visibleText: 'Guide me through Couette flow.',
        modelPrompt: '<problem_statement>Find u(y).</problem_statement>\n# Task\nAsk one guiding question.',
        hiddenContext: '<reference_solution hidden="true">SECRET_RESULT_42</reference_solution>',
        ragQuery: 'Navier-Stokes Couette flow parallel plates',
        socratic: true,
        lang: 'en'
      }).then(function () {
        var visibleText = drawer.textContent || '';
        var sysMsg = lastReq && lastReq.messages && lastReq.messages[0] ? lastReq.messages[0].content : '';
        check('socratic-hidden-not-leaked-in-dom', visibleText.indexOf('SECRET_RESULT_42') < 0, 'hidden solution kept out of UI');
        check('socratic-hidden-sent-to-model', sysMsg.indexOf('SECRET_RESULT_42') >= 0, 'hidden solution in system prompt');
        check('rag-grounded-in-system', sysMsg.indexOf('Couette flow') >= 0, 'RAG chunk injected');
        check('think-accordion-rendered', !!drawer.querySelector('details.sd-think'), 'collapsible think block');
        check('math-block-rendered', !!drawer.querySelector('.sd-math-block') && !!drawer.querySelector('.sd-math-inline'), 'math blocks rendered');
        check('no-xss-execution', !window.__xss && !drawer.querySelector('img[onerror]'), 'safe DOM rendering');
        check('rag-citation-shown', !!drawer.querySelector('.sd-rag-notes'), 'RAG notes collapsible shown');

        // Conversation history saved, survives clearChat, reloads and deletes cleanly
        var saved = window.AESideris.history();
        check('history-saved', saved.length === 1 && saved[0].messages.length === 2, 'saved=' + saved.length);
        var savedId = saved[0].id;
        window.AESideris.clearChat();
        check('welcome-guide-shows-all-four', drawer.querySelectorAll('.sd-guide-card').length === 4, '4 model guide cards on welcome screen');
        window.AESideris.loadConversation(savedId);
        check('history-reloads', window.AESideris.state().count === 2 && drawer.querySelectorAll('.sd-msg').length === 2, 'reloaded 2 messages');
        // Inline composer model picker opens and shows 4 model explanations
        drawer.querySelector('.sd-picker-btn').click();
        check('inline-picker-opens', !drawer.querySelector('.sd-model-menu').hidden && drawer.querySelectorAll('.sd-model-opt').length === 4, 'inline picker has 4 models');
        drawer.querySelector('.sd-picker-btn').click();
        window.AESideris.deleteConversation(savedId);

        // Free chat sends what is on screen (the card in view), not just the page title
        window.AESideris.clearChat();
        return window.AESideris.sendUserMessage('explain this').then(function () {
          var sys = lastReq.messages[0].content;
          check('page-context-sent', sys.indexOf('Find the velocity profile') >= 0 && sys.indexOf('Problem: Couette flow') >= 0, 'card in view reaches the model');
          // Long Ask AI prompts are not replayed: earlier turns go as the student's own words
          window.AESideris.clearChat();
          return window.AESideris.openWithAskRequest({
            visibleText: 'Short visible question', modelPrompt: 'LONG_PROMPT_' + new Array(3000).join('x'), lang: 'en'
          });
        }).then(function () {
          return window.AESideris.sendUserMessage('and now?');
        }).then(function () {
          var all = JSON.stringify(lastReq.messages.slice(1));
          check('history-budget', all.indexOf('LONG_PROMPT_') < 0 && all.indexOf('Short visible question') >= 0, 'old turn sent as display text');
          return window.AESiderisRAG.search('how do I cook pasta', { subject: 'fluid-mechanics' });
        }).then(function (hits) {
          check('rag-drops-off-topic', hits.length === 0, 'hits=' + hits.length);
          // Streaming 60 tokens over ~600 ms must not re-render the answer on every token
          window.AESideris.clearChat();
          window.AESiderisEngine.setMock(function (req, cb) {
            return new Promise(function (resolve) {
              var full = '', n = 0;
              (function tick() {
                full += 'tok $x_' + n + '$ ';
                cb.onToken('', full);
                if (++n < 60) setTimeout(tick, 10); else resolve(full);
              })();
            });
          });
          var renders = 0;
          var mo = new MutationObserver(function (list) {
            list.forEach(function (rec) { if (rec.target.classList && rec.target.classList.contains('sd-msg__content') && rec.removedNodes.length) renders++; });
          });
          mo.observe(drawer, { childList: true, subtree: true });
          return window.AESideris.sendUserMessage('stream test').then(function () {
            mo.disconnect();
            check('stream-render-throttled', renders <= 5, 'renders=' + renders);
          });
        }).then(function () {
          // 1. Prompt budget: a long hidden solution is kept whole, the rest fits the worker cap
          window.AESiderisEngine.setMock(function (req, cb) { lastReq = req; cb.onToken('ok', 'ok'); return Promise.resolve('ok'); });
          var bigSolution = 'SOLUTION_START ' + new Array(1400).join('step ') + ' SOLUTION_END';
          return window.AESideris.openWithAskRequest({
            visibleText: 'Check my work', modelPrompt: 'Check it', lang: 'en',
            hiddenContext: '<reference_solution hidden="true">' + bigSolution + '</reference_solution>',
            ragQuery: 'Couette flow parallel plates'
          });
        }).then(function () {
          var sys = lastReq.messages[0].content;
          check('prompt-budget', sys.length <= 15500 && sys.indexOf('SOLUTION_END') > 0, 'system=' + sys.length);
          // 7. Hints only: the card statement is visible to the model, its solution travels hidden
          window.AESideris.clearChat();
          window.AESideris.setHintsOnly(true);
          return window.AESideris.sendUserMessage('give me a hint');
        }).then(function () {
          var sys = lastReq.messages[0].content;
          var hidden = sys.indexOf('<reference_solution hidden="true">');
          check('hints-only', hidden >= 0 && sys.indexOf('SECRET_RESULT_42') > hidden && sys.indexOf('SOCRATIC MODE') >= 0 &&
            sys.indexOf('Find the velocity profile') >= 0, 'solution hidden, Socratic rules on');
          window.AESideris.setHintsOnly(false);
          // 8. Ask Sideris from a selection: the selected text reaches the next question
          window.AESideris.clearChat();
          var p = document.querySelector('.problem-statement-box p');
          var r = document.createRange(); r.selectNodeContents(p);
          getSelection().removeAllRanges(); getSelection().addRange(r);
          window.AESideris.askAboutSelection();
          getSelection().removeAllRanges();
          return window.AESideris.sendUserMessage('what is asked here?');
        }).then(function () {
          var sys = lastReq.messages[0].content;
          check('ask-sideris-selection', sys.indexOf('Selected text') >= 0 && sys.indexOf('Find the velocity profile') >= 0, 'selection attached');
          // 4. Full storage: the oldest conversations are dropped and the student is told
          var realSet = Storage.prototype.setItem;
          Storage.prototype.setItem = function (k, v) {
            if (k === 'ae_sideris_chats' && JSON.parse(v).length > 1) { var e = new Error('full'); e.name = 'QuotaExceededError'; throw e; }
            return realSet.call(this, k, v);
          };
          window.AESideris.clearChat();
          return window.AESideris.sendUserMessage('another conversation').then(function () {
            Storage.prototype.setItem = realSet;
            var st = drawer.querySelector('.sd-status-line').textContent;
            check('history-quota', window.AESideris.history().length === 1 && /storage is full/.test(st), st);
          });
        }).then(function () {
          // 5 + 6. Spanish question finds the English note, and the hit links to its page
          window.AESiderisRAG.setData('fluid-mechanics', {
            subject: 'fluid-mechanics', label: 'Fluid Mechanics',
            pages: ['subjects/fluid-mechanics/problemas/topic-5-hydrostatics.html#fs4'],
            chunks: [
              { i: 1, u: 5, k: 'p', t: 'Problem - FS4 Square Valve', h: 'Moment balance', x: 'The hydrostatic pressure force on the gate and its moment about the hinge axis.', g: 1 },
              { i: 2, u: 4, k: 't', t: 'Topic 4 - Navier-Stokes', h: 'Couette flow', x: 'Velocity profile between parallel plates with viscosity.' }
            ].concat(['Reynolds number', 'Stream function', 'Vorticity', 'Boundary layer', 'Pipe flow', 'Jet thrust', 'Wake drag', 'Surface tension']
              .map(function (h, n) { return { i: 3 + n, u: 3, k: 't', t: 'Filler note', h: h, x: h + ' explained with a worked example.' }; }))
          });
          return window.AESiderisRAG.search('presion sobre la compuerta', { subject: 'fluid-mechanics' });
        }).then(function (hits) {
          check('rag-spanish-synonyms-and-link', hits.length === 1 && /topic-5-hydrostatics\.html#fs4$/.test(hits[0].url), hits.map(function (h) { return h.title + ' ' + h.url; }).join('; '));
          // The answer language follows the question (the model ignored the prompt rule)
          window.AESiderisEngine.setMock(function (req, cb) { lastReq = req; cb.onToken('ok', 'ok'); return Promise.resolve('ok'); });
          window.AESideris.clearChat();
          return window.AESideris.sendUserMessage('What is the velocity profile here?').then(function () {
            var en = lastReq.messages[0].content.indexOf('Answer in clear academic English') >= 0;
            window.AESideris.clearChat();
            return window.AESideris.sendUserMessage('¿Qué perfil de velocidad sale aquí?').then(function () {
              check('answer-language-follows-question', en && lastReq.messages[0].content.indexOf('academic Spanish') >= 0, 'en then es');
            });
          });
        }).then(function () {
          // A reasoning model that spends the whole budget thinking: Aether writes the answer
          var calls = [];
          window.AESiderisEngine.setMock(function (req, cb) {
            calls.push(req.model.id);
            var out = calls.length === 1 ? '<think>long reasoning cut off</think>\n' : 'FINAL_ANSWER';
            cb.onToken(out, out);
            return Promise.resolve(out);
          });
          window.AESideris.clearChat();
          window.AESideris.selectModel('sideris-titan');
          return window.AESideris.sendUserMessage('Derive the momentum equation').then(function (text) {
            check('reasoning-only-falls-back-to-aether', calls.join(',') === 'sideris-titan,sideris-aether' &&
              /long reasoning/.test(text) && /FINAL_ANSWER$/.test(text), calls.join(',') + ' | ' + text);
            window.AESideris.selectModel('sideris-aether');
          });
        }).then(function () {
          // A connection that drops half way keeps the part of the answer that arrived
          window.AESiderisEngine.setMock(function (req, cb) {
            cb.onToken('PARTIAL_ANSWER', 'PARTIAL_ANSWER');
            return Promise.reject(new Error('network error'));
          });
          window.AESideris.clearChat();
          return window.AESideris.sendUserMessage('Derive it').then(function () {
            var last = window.AESideris.history()[0].messages.slice(-1)[0];
            check('dropped-stream-keeps-partial-answer', !last.error && /^PARTIAL_ANSWER/.test(last.text) && /connection dropped/.test(last.text), last.text.slice(0, 120));
          });
        }).then(function () {
          // Automatic local models: tiers from the device signals
          var L = window.AESiderisEngine.local, G = 1073741824;
          var base = { webgpu: true, f16: true, mobile: false, saveData: false, memGB: 8, maxBuffer: 4 * G, freeMB: 1e6 };
          function sig(o) { var x = {}; for (var k in base) x[k] = base[k]; for (var j in o) x[j] = o[j]; return x; }
          var tiers = [L.classify(base), L.classify(sig({ maxBuffer: 1.5 * G })), L.classify(sig({ mobile: true })),
            L.classify(sig({ f16: false })), L.classify(sig({ webgpu: false })), L.classify(sig({ memGB: 4 })),
            L.classify(sig({ memGB: 0 })), L.classify(sig({ saveData: true })), L.classify(sig({ maxBuffer: 2 * G }))].join(',');
          check('local-tiers', tiers === '2,1,0,2,0,1,2,0,1', tiers);   // no shader-f16: the q4 build, same tier
          // Crash guard: a model still marked "loading" on the next visit is never tried again
          L.restore({ loading: 'sideris-lux' });
          check('local-crash-guard', !!L.state().failed['sideris-lux'] && !L.isReady('sideris-lux'), JSON.stringify(L.state().failed));
          // A "too slow" verdict of an older probe is dropped (the first probe timed the GPU warm-up);
          // a crash verdict is kept
          L.restore({ failed: { 'sideris-lux': 'too slow on this device (1.4 tokens/s)', 'sideris-orion': 'the tab closed while loading' } });
          var f = L.state().failed;
          check('local-old-slow-verdict-retried', !f['sideris-lux'] && !!f['sideris-orion'], JSON.stringify(f));
          L.restore({});
          // A tier-2 computer installs Lux, Aether and Orion (Titan stays in the cloud) and then answers on it
          var calls = [];
          window.AESiderisEngine.setMock(function (req, cb) {
            calls.push(req.model.backend + ':' + req.model.id);
            var out = 'LOCAL_OR_CLOUD ' + req.model.backend;
            for (var i = 0; i < 16; i++) cb.onToken('t', out);
            return Promise.resolve(out);
          });
          return L.start(window.AESideris.models(), base).then(function () {
            var ready = L.state().ready.sort().join(',');
            check('local-installs-what-fits', ready === 'sideris-aether,sideris-lux,sideris-orion', ready);
            // after installing in the background, the model that was in the GPU is put back
            return window.AESiderisEngine.loadWebGPU({ repo: 'onnx-community/Qwen3.5-2B-ONNX', dtype: 'q4f16' }).then(function () {
              L.restore({ ready: { 'sideris-lux': true } });
              return L.start(window.AESideris.models(), base);
            }).then(function () {
              var key = window.AESiderisEngine.loadedKey();
              check('local-gpu-model-put-back', key === 'onnx-community/Qwen3.5-2B-ONNX::q4f16' && /back in GPU/.test(L.state().log.join(' ')), key);
            });
          }).then(function () {
            window.AESideris.clearChat();
            window.AESideris.selectModel('sideris-aether');
            return window.AESideris.sendUserMessage('What is a streamline?');
          }).then(function (text) {
            var last = window.AESideris.history()[0].messages.slice(-1)[0];
            check('local-answers-on-device', /webgpu/.test(text) && /on this device/.test(last.modelName), text + ' | ' + last.modelName);
            // The device fails: the model is marked and the cloud answers
            window.AESiderisEngine.setMock(function (req, cb) {
              if (req.model.backend === 'webgpu') return Promise.reject(new Error('GPU device lost'));
              cb.onToken('CLOUD', 'CLOUD'); return Promise.resolve('CLOUD');
            });
            window.AESideris.clearChat();
            return window.AESideris.sendUserMessage('And a pathline?');
          }).then(function (text) {
            check('local-failure-falls-back-to-cloud', text === 'CLOUD' && !L.isReady('sideris-aether') && !L.state().failed['sideris-aether'] &&
              /set aside for this page/.test(L.state().log.join(' ')), text + ' | ' + JSON.stringify(L.state().failed));
            // A device that stays silent hands the question to the cloud, with the full context
            L.restore({ ready: { 'sideris-lux': true } });
            window.AESideris.selectModel('sideris-lux');
            window.AESideris._setLocalFirstWordMs(300);
            var cloudSys = '';
            window.AESiderisEngine.setMock(function (req, cb) {
              if (req.model.backend === 'webgpu') return new Promise(function (r) { setTimeout(function () { r(''); }, 2000); });
              cloudSys = req.messages[0].content; cb.onToken('CLOUD_AFTER_SILENCE', 'CLOUD_AFTER_SILENCE'); return Promise.resolve('CLOUD_AFTER_SILENCE');
            });
            window.AESideris.clearChat();
            return window.AESideris.sendUserMessage('Is the device silent?');
          }).then(function (text) {
            window.AESideris._setLocalFirstWordMs(25000);
            var log = L.state().log.join(' | ');
            check('local-silence-falls-back-to-cloud', text === 'CLOUD_AFTER_SILENCE' && L.isReady('sideris-lux') && /no first word/.test(log), text + ' | ' + log.slice(-120));
            window.AESideris.selectModel('sideris-aether');
            // Too slow on this device: not used
            L.restore({});
            // 4 tokens 700 ms apart after a quick warm-up: 1.4 tokens/s of real decoding
            window.AESiderisEngine.setMock(function (req, cb) {
              if (req.maxTokens <= 4) return Promise.resolve('');
              return new Promise(function (r) {
                var i = 0;
                (function tick() { cb.onToken('t', 't'); if (++i < 4) setTimeout(tick, 700); else r('tttt'); })();
              });
            });
            return L.start(window.AESideris.models(), sig({ maxBuffer: 1.5 * G }));
          }).then(function () {
            check('local-slow-device-stays-in-cloud', !L.isReady('sideris-lux') && /slow/.test(L.state().failed['sideris-lux'] || ''), JSON.stringify(L.state().failed) + ' | ' + L.state().log.slice(-4).join(' | '));
            // Out of the cloud allowance while a model downloads: the wait time replaces "tomorrow"
            var realEta = L.eta;
            L.eta = function () { return { seconds: 540, name: 'Sideris Aether' }; };
            window.AESiderisEngine.setMock(function () {
              return Promise.reject(new Error("You have used today's Sideris allowance. It resets tomorrow (00:00 UTC)."));
            });
            window.AESideris.clearChat();
            return window.AESideris.sendUserMessage('One more?').then(function () {
              L.eta = realEta;
              var last = window.AESideris.history()[0].messages.slice(-1)[0];
              check('allowance-shows-local-wait', /about 9 minutes/.test(last.text) && /unlimited/.test(last.text), last.text);
              L.restore({});
              window.AESideris.selectModel('sideris-aether');
            });
          });
        }).then(function () {
          // Resumable model files: a fake server with byte ranges, parts of 10 bytes
          var T = window.AESiderisEngine.local._test, C = window.AESiderisEngine.local.cache;
          var file = ''; for (var i = 0; i < 95; i++) file += String.fromCharCode(65 + (i % 26));
          var reqs = [], fail = { '30': 6 }, ignoreRange = false;   // 6 failures: the first try and its 5 retries
          // The Cache API does real disk work that the headless virtual clock does not wait for, so the
          // harness swaps in a memory store with the same match/put/delete (the real one is checked in a browser).
          function memCache() {
            var m = {};
            return {
              match: function (k) { var b = m[String(k.url || k)]; return Promise.resolve(b === undefined ? undefined : new Response(b)); },
              put: function (k, r) { return r.arrayBuffer().then(function (b) { m[String(k.url || k)] = b; }); },
              delete: function (k) { delete m[String(k.url || k)]; return Promise.resolve(true); }
            };
          }
          var memStore = { c: {}, open: function (n) { return Promise.resolve(this.c[n] || (this.c[n] = memCache())); } };
          T.setStore(memStore);
          T.setChunk(10);
          T.setRetryMs(1);
          T.setFetch(function (url, opts) {
            var range = /bytes=(\d+)-(\d+)/.exec((opts && opts.headers && opts.headers.Range) || '');
            reqs.push(url.split('/').pop() + ':' + (range ? range[1] : 'all'));
            if (/\/api\/models\//.test(url)) return Promise.resolve(new Response(JSON.stringify([
              { type: 'file', path: 'config.json', size: 700 }, { type: 'file', path: 'README.md', size: 50 },
              { type: 'file', path: 'onnx/model_q4f16.onnx', size: 300 }, { type: 'file', path: 'onnx/model_q4f16.onnx_data', size: 9, lfs: { size: 1990 } },
              { type: 'file', path: 'onnx/model_q4.onnx', size: 310 }, { type: 'file', path: 'onnx/model_q4.onnx_data', size: 9, lfs: { size: 2400 } },
              { type: 'file', path: 'onnx/model_fp16.onnx', size: 320 }]), { status: 200 }));
            if (/missing\.json$/.test(url)) return Promise.resolve(new Response('', { status: 404 }));
            var key = range ? range[1] : '';
            if (fail[key] > 0 && url.indexOf(failFile) >= 0) { fail[key]--; return Promise.reject(new TypeError('Failed to fetch')); }
            if (!range || ignoreRange) return Promise.resolve(new Response(file, { status: 200 }));
            var a = +range[1], b = Math.min(+range[2], file.length - 1);
            if (a >= file.length) return Promise.resolve(new Response('', { status: 416 }));
            // parts answer in a random order, as parallel requests do
            return new Promise(function (r) { setTimeout(function () { r(new Response(file.slice(a, b + 1), { status: 206 })); }, Math.random() * 8); });
          });
          var big = 'https://huggingface.co/test/model/resolve/main/onnx/model_q4f16.onnx_data', failFile = 'model_q4f16.onnx_data';
          return T.download(big).then(function () { return 'no failure'; }, function (e) { return e.message; }).then(function (first) {
            var before = reqs.length;
            return T.download(big).then(function (meta) {
              var again = reqs.slice(before);
              check('download-resumes-after-a-cut', first === 'Failed to fetch' && again[0] === 'model_q4f16.onnx_data:30' && again.indexOf('model_q4f16.onnx_data:0') < 0 && meta.done && meta.size === 95,
                first + ' | resumed with ' + again.join(','));
              return C.match(big);
            });
          }).then(function (res) { return res.text(); }).then(function (text) {
            check('download-parts-read-back-whole', text === file && (T.files()['test/model'] || []).indexOf(big) >= 0, text.length + ' chars');
            return C.match('https://huggingface.co/test/model/resolve/main/missing.json');
          }).then(function (res) {
            check('download-missing-file', res === undefined, String(res));
            ignoreRange = true;
            return C.match('https://huggingface.co/test/model/resolve/main/config.json');
          }).then(function (res) { return res.text(); }).then(function (text) {
            check('download-server-ignores-range', text === file, text.length + ' chars');
            ignoreRange = false;
            // A file kept by the old Transformers.js cache moves over without a download
            var old = 'https://huggingface.co/test/model/resolve/main/tokenizer.json';
            return memStore.open('transformers-cache').then(function (c) { return c.put(old, new Response('LEGACY_TOKENIZER')).then(function () { return c; }); })
              .then(function (c) {
                var n = reqs.length;
                return C.match(old).then(function (res) { return res.text(); }).then(function (text) {
                  return c.match(old).then(function (left) {
                    check('download-legacy-cache-moved', text === 'LEGACY_TOKENIZER' && reqs.length === n && !left, text + ' | requests ' + (reqs.length - n));
                  });
                });
              });
          }).then(function () {
            // A dropped part is retried on the same page (twice here) instead of stopping the download
            var url2 = 'https://huggingface.co/test/model/resolve/main/onnx/retry_q4f16.onnx_data';
            failFile = 'retry_q4f16.onnx_data'; fail = { '40': 2 };
            var n0 = reqs.length;
            return T.download(url2).then(function (meta) {
              var tries = reqs.slice(n0).filter(function (r) { return r === 'retry_q4f16.onnx_data:40'; }).length;
              check('download-retries-on-the-same-page', meta.done && meta.size === 95 && tries === 3, 'tries at 40: ' + tries);
            });
          }).then(function () {
            // Size known: parts in parallel, answering out of order, read back in order
            var url3 = 'https://huggingface.co/test/model/resolve/main/onnx/par_q4f16.onnx_data';
            T.setSize(url3, 95);
            failFile = 'none'; var n0 = reqs.length;
            return T.download(url3).then(function (meta) {
              var asked = reqs.slice(n0).filter(function (r) { return r.indexOf('par_q4f16') === 0; }).length;
              return C.match(url3).then(function (res) { return res.text(); }).then(function (text) {
                check('download-parallel-parts-in-order', text === file && asked === 10 && meta.parts === 10, asked + ' requests, ' + text.length + ' chars');
              });
            });
          }).then(function () {
            // Parallel and cut: the next visit asks only for the part that is missing
            var url4 = 'https://huggingface.co/test/model/resolve/main/onnx/cut_q4f16.onnx_data';
            T.setSize(url4, 95);
            failFile = 'cut_q4f16.onnx_data'; fail = { '70': 6 };
            return T.download(url4).then(function () { return 'no failure'; }, function (e) { return e.message; }).then(function (first) {
              var n0 = reqs.length;
              return T.download(url4).then(function (meta) {
                var again = reqs.slice(n0).filter(function (r) { return r.indexOf('cut_q4f16') === 0; });
                return C.match(url4).then(function (res) { return res.text(); }).then(function (text) {
                  check('download-parallel-resumes-missing-only', first === 'Failed to fetch' && again.join(',') === 'cut_q4f16.onnx_data:70' && text === file,
                    first + ' | then ' + again.join(','));
                });
              });
            });
          }).then(function () {
            // Parallel against a server that ignores ranges: the whole body is streamed into parts
            var url5 = 'https://huggingface.co/test/model/resolve/main/onnx/norange_q4f16.onnx_data';
            T.setSize(url5, 95);
            failFile = 'none'; ignoreRange = true;
            return T.download(url5).then(function (meta) {
              ignoreRange = false;
              return C.match(url5).then(function (res) { return res.text(); }).then(function (text) {
                check('download-parallel-server-ignores-range', text === file && meta.parts === 10, meta.parts + ' parts, ' + text.length + ' chars');
              });
            });
          }).then(function () {
            // The listing keeps the root files and the ONNX files of the device's build only; q4 without shader-f16
            return T.list({ repo: 'test/model' }, 'q4').then(function (files) {
              var names = files.map(function (f) { return f.url.split('/main/')[1] + ':' + f.size; }).join(',');
              var L2 = window.AESiderisEngine.local;
              L2.restore({ noF16: true });
              var noF16 = L2.dtypeFor({ dtype: 'q4f16' });
              L2.restore({});
              check('download-list-and-build', names === 'config.json:700,onnx/model_q4.onnx:310,onnx/model_q4.onnx_data:2400' &&
                noF16 === 'q4' && L2.dtypeFor({ dtype: 'q4f16' }) === 'q4f16', names + ' | ' + noF16);
            });
          }).then(function () {
            T.setFetch(function (u, o) { return fetch(u, o); });
            T.setChunk(32 * 1048576);
            T.setStore(window.caches);
          });
        }).then(function () {
          // Each model gets its own style; a greeting carries no page context or notes; on the device the rules are short
          var seen = [];
          window.AESiderisEngine.setMock(function (req, cb) { seen.push(req); cb.onToken('Hi!', 'Hi!'); return Promise.resolve('Hi!'); });
          window.AESiderisEngine.local.restore({ ready: { 'sideris-lux': true } });
          window.AESideris.selectModel('sideris-lux');
          window.AESideris.clearChat();
          return window.AESideris.sendUserMessage('hola').then(function () {
            return window.AESideris.sendUserMessage('What is the velocity profile here?');
          }).then(function () {
            var hola = seen[0].messages[0].content, real = seen[1].messages[0].content;
            check('prompt-per-model-and-greeting', /Sideris Lux/.test(hola) && /fast and brief/.test(hola) &&
              hola.indexOf('[WHAT THE STUDENT') < 0 && hola.indexOf('COURSE NOTES') < 0 && real.indexOf('[WHAT THE STUDENT') >= 0,
              'greeting ' + hola.length + ' chars, question ' + real.length + ' chars');
            check('prompt-compact-on-device', seen[1].model.backend === 'webgpu' && real.length <= 5000 && real.indexOf('Be easy to scan') < 0,
              seen[1].model.backend + ' ' + real.length + ' chars');
            window.AESiderisEngine.local.restore({});
            window.AESideris.selectModel('sideris-aether');
          });
        }).then(function () {
          // 3. The prebuilt index of build_ai_index.py must use the same tokens as the browser
          check('tokenizer-sample', true, JSON.stringify(window.AESiderisRAG.tokenize(
            'Explícame el \\nabla \\cdot u = 0 con r_1, EBITDA y la Ecuación de Navier-Stokes (2024) of the fluid')));
        }).then(function () {
          // Escape closes drawer
          drawer.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          check('escape-closes', drawer.hidden && !window.AESideris.isOpen(), 'closed by Escape');
          finish();
        });
      }).catch(function (err) {
        check('async-error', false, String(err));
        finish();
      });
    } catch (err) {
      check('runtime-error', false, String(err));
      finish();
    }
  }, 400);
});
