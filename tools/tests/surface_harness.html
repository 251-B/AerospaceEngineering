<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reading-surface harness</title>
<!-- Driven by test_surface.py through headless Edge/Chrome (--dump-dom). Each scenario runs in a fresh iframe. -->
</head>
<body>
<pre id="results">PENDING</pre>
<script>
(function () {
  var results = [];

  function record(name, ok, detail) {
    results.push({ name: name, pass: !!ok, detail: ok ? '' : String(detail) });
  }

  // `setup` runs before theme.js; `withCss` adds the study-surface.css link that switches the picker on.
  function frame(setup, withCss) {
    return new Promise(function (resolve) {
      var f = document.createElement('iframe');
      f.onload = function () { resolve(f); };
      f.srcdoc = '<!doctype html><html data-theme="dark"><head><script>' + setup + '<\/script>' +
        (withCss ? '<link rel="stylesheet" href="../../assets/css/study-surface.css">' : '') +
        '<script src="../../assets/js/theme.js"><\/script></head>' +
        '<body><div class="nav-actions"><button id="themeToggle">t</button></div></body></html>';
      document.body.appendChild(f);
    });
  }

  async function scenario(name, setup, check, withCss) {
    var f;
    try {
      f = await frame('localStorage.clear();' + setup, withCss);
      var w = f.contentWindow;
      if (!w.AESurface) { record(name, false, 'window.AESurface is not defined (theme.js missing or crashed)'); return; }
      var d = w.document, el = d.documentElement;
      var verdict = check(w, d, el, w.localStorage);
      record(name, verdict === true, verdict);
    } catch (e) {
      record(name, false, 'exception: ' + e);
    } finally {
      if (f) f.remove(); // a finished scenario must not keep reacting to the next one's storage writes
    }
  }

  function expect(cond, msg) { return cond ? true : msg; }
  function state(el, ls) {
    return 'surface=' + el.getAttribute('data-surface') + ' theme=' + el.getAttribute('data-theme') +
      ' ae_surface=' + ls.getItem('ae_surface') + ' ae_theme=' + ls.getItem('ae_theme');
  }

  (async function () {
    await scenario('defaults to "default" and writes nothing', '', function (w, d, el, ls) {
      return expect(el.getAttribute('data-surface') === 'default' && ls.getItem('ae_surface') === null &&
        ls.getItem('ae_theme') === null && w.AESurface.get() === 'default', state(el, ls));
    });
    await scenario('restores a stored light palette', "localStorage.setItem('ae_theme','light');localStorage.setItem('ae_surface','cream');", function (w, d, el, ls) {
      return expect(el.getAttribute('data-surface') === 'cream' && el.getAttribute('data-theme') === 'light', state(el, ls));
    });
    await scenario('restores charcoal on the dark theme', "localStorage.setItem('ae_theme','dark');localStorage.setItem('ae_surface','charcoal');", function (w, d, el, ls) {
      return expect(el.getAttribute('data-surface') === 'charcoal' && el.getAttribute('data-theme') === 'dark', state(el, ls));
    });
    await scenario('a stored palette that contradicts the theme sets the theme', "localStorage.setItem('ae_theme','dark');localStorage.setItem('ae_surface','sepia');", function (w, d, el, ls) {
      return expect(el.getAttribute('data-surface') === 'sepia' && ls.getItem('ae_surface') === 'sepia' &&
        el.getAttribute('data-theme') === 'light', state(el, ls));
    });
    await scenario('an unknown stored value is ignored', "localStorage.setItem('ae_surface','neon');", function (w, d, el, ls) {
      return expect(el.getAttribute('data-surface') === 'default', state(el, ls));
    });
    await scenario('set() on a light palette switches the theme to light', '', function (w, d, el, ls) {
      w.AESurface.set('sage');
      return expect(el.getAttribute('data-surface') === 'sage' && el.getAttribute('data-theme') === 'light' &&
        ls.getItem('ae_surface') === 'sage' && ls.getItem('ae_theme') === 'light', state(el, ls));
    });
    await scenario('set(charcoal) switches the theme to dark', "localStorage.setItem('ae_theme','light');", function (w, d, el, ls) {
      w.AESurface.set('charcoal');
      return expect(el.getAttribute('data-surface') === 'charcoal' && el.getAttribute('data-theme') === 'dark' &&
        ls.getItem('ae_theme') === 'dark', state(el, ls));
    });
    await scenario('set(default) returns to the portal theme (dark)', "localStorage.setItem('ae_theme','light');", function (w, d, el, ls) {
      w.AESurface.set('default');
      return expect(el.getAttribute('data-surface') === 'default' && el.getAttribute('data-theme') === 'dark' &&
        ls.getItem('ae_surface') === 'default', state(el, ls));
    });
    await scenario('set() ignores unknown ids', '', function (w, d, el, ls) {
      w.AESurface.set('neon');
      return expect(el.getAttribute('data-surface') === 'default' && ls.getItem('ae_surface') === null, state(el, ls));
    });
    await scenario('toggling the theme away from a palette resets it', '', function (w, d, el, ls) {
      w.AESurface.set('cream');
      w.AETheme.toggle();
      return expect(el.getAttribute('data-surface') === 'default' && el.getAttribute('data-theme') === 'dark' &&
        ls.getItem('ae_surface') === 'default', state(el, ls));
    });
    await scenario('toggling the theme keeps a palette that still fits', '', function (w, d, el, ls) {
      w.AESurface.set('charcoal');
      w.AETheme.set('dark');
      return expect(el.getAttribute('data-surface') === 'charcoal', state(el, ls));
    });
    await scenario('the surface key is ae_surface and contains no "theme"', '', function (w) {
      return expect(w.AESurface.KEY === 'ae_surface' && w.AESurface.KEY.indexOf('theme') < 0 && w.AETheme.KEY === 'ae_theme',
        'AESurface.KEY=' + w.AESurface.KEY + ' AETheme.KEY=' + w.AETheme.KEY);
    });
    await scenario('list() exposes the six palettes', '', function (w) {
      var ids = w.AESurface.list().map(function (s) { return s.id; }).join(',');
      return expect(ids === 'default,cream,sepia,slate-paper,sage,charcoal', ids);
    });
    await scenario('ae-surface-change carries the new id', '', function (w, d) {
      var seen = [];
      d.addEventListener('ae-surface-change', function (e) { seen.push(e.detail.surface); });
      w.AESurface.set('sepia');
      return expect(seen.join(',') === 'sepia', 'events=' + seen.join(','));
    });
    await scenario('another tab changing ae_surface is applied', '', function (w, d, el) {
      w.dispatchEvent(new w.StorageEvent('storage', { key: 'ae_surface', newValue: 'sage' }));
      var applied = el.getAttribute('data-surface');
      w.dispatchEvent(new w.StorageEvent('storage', { key: 'ae_surface', newValue: null }));
      return expect(applied === 'sage' && el.getAttribute('data-surface') === 'default', 'applied=' + applied);
    });
    await scenario('no picker without study-surface.css', '', function (w, d) {
      return expect(!d.getElementById('surfacePicker'), 'picker present');
    }, false);
    await scenario('one picker before #themeToggle; its panel on <body> with six radios', '', function (w, d) {
      var all = d.querySelectorAll('#surfacePicker');
      var picker = all[0];
      return expect(all.length === 1 && picker.nextElementSibling === d.getElementById('themeToggle') &&
        d.querySelectorAll('#surfacePanel [role="radio"]').length === 6 && d.getElementById('surfacePanel').parentNode === d.body,
        'pickers=' + all.length);
    }, true);
    await scenario('picker: open, choose, Escape', '', function (w, d, el, ls) {
      var wrap = d.getElementById('surfacePicker'), button = d.getElementById('surfaceButton');
      button.click();
      var opened = wrap.classList.contains('is-open') && button.getAttribute('aria-expanded') === 'true';
      d.querySelector('[data-surface="slate-paper"][role="radio"]').click();
      var chosen = el.getAttribute('data-surface') === 'slate-paper' &&
        d.querySelector('[data-surface="slate-paper"][role="radio"]').getAttribute('aria-checked') === 'true' &&
        d.querySelectorAll('[role="radio"][aria-checked="true"]').length === 1;
      d.getElementById('surfacePanel').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      var closed = !wrap.classList.contains('is-open') && !d.getElementById('surfacePanel').classList.contains('is-open') &&
        button.getAttribute('aria-expanded') === 'false';
      return expect(opened && chosen && closed, 'opened=' + opened + ' chosen=' + chosen + ' closed=' + closed);
    }, true);
    await scenario('a theme change mirrored from another tab does not rewrite ae_surface', '', function (w, d, el, ls) {
      w.AESurface.set('cream');
      ls.setItem('ae_surface', 'charcoal');           // what the other tab wrote first...
      w.dispatchEvent(new w.StorageEvent('storage', { key: 'ae_theme', newValue: 'dark' })); // ...then its theme
      ls.setItem('ae_theme', 'dark');
      return expect(ls.getItem('ae_surface') === 'charcoal' && el.getAttribute('data-theme') === 'dark', state(el, ls));
    });
    await scenario('the theme toggle is hidden when the picker is used', '', function (w, d, el, ls) {
      var b = d.getElementById('themeToggle');
      return expect(b.hidden && !!d.getElementById('surfacePicker'), 'hidden=' + b.hidden);
    }, true);

    document.getElementById('results').textContent = JSON.stringify(results);
  })();
})();
</script>
</body>
</html>
