<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Constellation HUD harness</title>
<!-- Loaded by test_constellations.py: opens the portal at a desktop and a phone size, enters every
     constellation and writes the satellite-label problems (overlap, text outside its box, clipped) as JSON. -->
</head>
<body>
<pre id="result">pending</pre>
<script>
var SIZES = [[1280, 800], [768, 1024], [375, 812]];
var SLUGS = ['fluid-mechanics', 'aerospace-materials-1', 'engineering-mechanics', 'advanced-maths', 'business-management'];
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function load(w, h) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.border = '0';
    f.src = '../../index.html?intro=0';   // the state after the welcome screen
    f.onload = function () { resolve(f); };
    document.body.appendChild(f);
  });
}
async function check(f, w, h) {
  var win = f.contentWindow, doc = f.contentDocument, out = {};
  for (var t = 0; t < 50 && !(win.AEConstellations && doc.querySelector('.const')); t++) await wait(100);
  await wait(3500);   // the entrance animation of the map and caption is over
  // the panorama shows plain stars only: no satellite is visible before a constellation is opened
  out.panoramaHidden = Array.prototype.every.call(doc.querySelectorAll('.star-sat'), function (s) { return getComputedStyle(s).visibility === 'hidden'; });
  function span(g) {   // on-screen extent of a figure's stars
    var sr = Array.prototype.map.call(g.querySelectorAll('.star-core'), function (c) { return c.getBoundingClientRect(); });
    return Math.max(Math.max.apply(null, sr.map(function (b) { return b.right; })) - Math.min.apply(null, sr.map(function (b) { return b.left; })),
                    Math.max.apply(null, sr.map(function (b) { return b.bottom; })) - Math.min.apply(null, sr.map(function (b) { return b.top; })));
  }
  var panoSpan = {};
  SLUGS.forEach(function (s) { panoSpan[s] = span(doc.querySelector('.const[data-slug="' + s + '"]')); });
  for (var i = 0; i < SLUGS.length; i++) {
    var slug = SLUGS[i], issues = [];
    win.AEConstellations.back(); await wait(50);
    win.AEConstellations.select(slug); await wait(100);
    win.dispatchEvent(new win.Event('resize')); await wait(600);   // headless frames get no animation frames: a resize makes the camera jump
    var g = doc.querySelector('.const.is-active');
    if (!g) { out[slug] = ['not opened']; continue; }
    var vb = doc.getElementById('skySvg').viewBox.baseVal;
    var zoom = span(g) / panoSpan[slug], least = w < 900 && w / h < 0.85 ? 0.95 : 1.3;   // phones and upright tablets: the panorama is already a large scrolled column
    if (!(zoom >= least)) issues.push('camera did not zoom: figure ' + zoom.toFixed(2) + 'x its panorama size, expected ' + least + 'x');
    var labels = Array.prototype.map.call(g.querySelectorAll('.star'), function (a) {
      var box = a.querySelector('.sat-hit').getBoundingClientRect(), name = a.querySelector('.sat-name').textContent;
      if (getComputedStyle(a.querySelector('.star-sat')).visibility !== 'visible') issues.push('hidden ' + name);
      if (!a.querySelector('use.sat-icon')) issues.push('no icon ' + name);
      Array.prototype.forEach.call(a.querySelectorAll('text'), function (tx) {
        var r = tx.getBoundingClientRect();
        if (r.left < box.left - 1 || r.right > box.right + 1 || r.top < box.top - 1 || r.bottom > box.bottom + 1) issues.push('text outside its box ' + tx.textContent);
        if (r.left < 0 || r.right > w || r.top < 56 || r.bottom > h) issues.push('clipped ' + tx.textContent);
      });
      return { name: name, box: box };
    });
    labels.forEach(function (a, p) { labels.forEach(function (b, q) {
      if (q > p && a.box.left < b.box.right - 2 && b.box.left < a.box.right - 2 && a.box.top < b.box.bottom - 2 && b.box.top < a.box.bottom - 2) issues.push('overlap ' + a.name + ' / ' + b.name + ' ' + [a.box, b.box].map(function (x) { return [x.left, x.top, x.right, x.bottom].map(Math.round).join(','); }).join(' | '));
    }); });
    var cap = doc.getElementById('skyCaption').getBoundingClientRect();   // the subject name and hint at the bottom
    labels.forEach(function (a) { if (a.box.bottom > cap.top + 4 && a.box.right > cap.left && a.box.left < cap.right && a.box.top < cap.bottom) issues.push('under the caption ' + a.name + ' box bottom ' + Math.round(a.box.bottom) + ', caption top ' + Math.round(cap.top)); });
    if (issues.length) issues.push('viewBox ' + doc.getElementById('skySvg').getAttribute('viewBox'));
    out[slug] = issues;
  }
  win.AEConstellations.back(); await wait(50);
  return out;
}
(async function () {
  var all = {};
  for (var k = 0; k < SIZES.length; k++) {
    var f = await load(SIZES[k][0], SIZES[k][1]);
    all[SIZES[k].join('x')] = await check(f, SIZES[k][0], SIZES[k][1]);
    f.remove();
  }
  document.getElementById('result').textContent = JSON.stringify(all);
})();
</script>
</body>
</html>
