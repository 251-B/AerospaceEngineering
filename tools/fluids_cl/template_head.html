<!DOCTYPE html>
<html lang="en" data-theme="dark" data-celestial-subject="fluid-mechanics">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Kinematics Solved Problems (K1-K10) - Fluid Mechanics</title>

  <!-- Google Fonts: Abril Fatface, Newsreader, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>

  <style>
    :root {
      --font-display: 'Abril Fatface', cursive, Georgia, serif;
      --font-body: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --accent: #06b6d4;
      --accent-soft: rgba(6, 182, 212, 0.12);
      --accent-border: rgba(6, 182, 212, 0.28);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.12);

      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-base: #070b14;
      --bg-surface: #0f172a;
      --bg-card: rgba(15, 23, 42, 0.7);
      --bg-subtle: #1e293b;
      --bg-input: rgba(255, 255, 255, 0.05);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text-heading: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-subtle: #f1f5f9;
      --bg-input: rgba(0, 0, 0, 0.04);
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-heading: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .problem-title, .subpart-title {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.015em;
    }

    code, pre, .badge, .brand-badge {
      font-family: var(--font-mono);
    }

    /* Universal Bilingual Switcher */
    .lang-switch {
      display: inline-flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      gap: 4px;
    }
    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      transition: color var(--transition);
      border-radius: 4px;
    }
    .lang-btn.active, .lang-btn:hover {
      color: var(--accent);
    }
    .lang-divider {
      color: var(--border-subtle);
      font-size: 10px;
    }

    /* Celestial light background & dark neon glow */
    [data-theme="light"] {
      background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    [data-theme="dark"] .problem-card:hover {
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 22%, transparent), 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Top Sticky Navigation */
    header.site-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--accent-border);
      letter-spacing: 0.5px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      transition: all var(--transition);
    }

    .back-link:hover {
      color: var(--accent);
      border-color: var(--accent-border);
    }

    .theme-toggle {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      position: relative;
      transition: background var(--transition);
    }

    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-heading);
      transition: transform var(--transition);
    }

    [data-theme="light"] .theme-toggle::after {
      transform: translateX(18px);
    }

    /* Quick Problem Bar */
    body > nav.quick-nav,
    .quick-nav {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 0;
      position: sticky !important;
      top: 53px;
      z-index: 95 !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .quick-nav-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .quick-nav-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .p-pill {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-muted);
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .p-pill:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .p-pill.active {
      color: #070b14;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.45);
    }

    /* Main Container */
    main.content-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-title-box {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .topic-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1.page-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 2.5rem);
      font-weight: 600;
      color: var(--text-heading);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .page-meta {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .verified-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 8px 14px;
      border-radius: 6px;
      background: var(--success-soft);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
    }

    /* Problem Card */
    .problem-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 32px 28px;
      margin-bottom: 40px;
      scroll-margin-top: 120px;
      transition: border-color var(--transition);
    }

    .problem-card:hover {
      border-color: var(--border-strong);
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .problem-title-group {
      flex: 1;
    }

    .problem-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .problem-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text-heading);
      line-height: 1.35;
    }

    .tag-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    /* Enunciado Box */
    .enunciado-box {
      background: var(--bg-card);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 18px 20px;
      margin-bottom: 28px;
    }

    .enunciado-box h4 {
      font-family: var(--font-sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .enunciado-box ol {
      padding-left: 20px;
      margin-top: 8px;
    }

    .enunciado-box li {
      margin-bottom: 6px;
      color: var(--text-heading);
      font-size: 14.5px;
    }

    /* Subpart section */
    .subpart {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }

    .subpart-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subpart-title .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }

    .subpart p {
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.7;
    }

    /* Result callout */
    .result-box {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      padding: 14px 18px;
      margin: 16px 0;
    }

    .result-box strong {
      color: var(--accent);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }

    /* Note callout */
    .note-box {
      background: var(--bg-subtle);
      border-left: 3px solid var(--warning);
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
      margin: 14px 0;
      font-size: 14px;
    }

    .note-box strong {
      color: var(--warning);
    }

    /* Step lists */
    ol.step-list {
      padding-left: 22px;
      margin: 12px 0;
    }

    ol.step-list li {
      margin-bottom: 8px;
    }

    ul.bullet-list {
      padding-left: 20px;
      margin: 10px 0;
    }

    ul.bullet-list li {
      margin-bottom: 6px;
    }

    /* Footer */
    footer.site-footer {
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      padding: 32px 0;
      font-size: 13px;
      color: var(--text-muted);
    }


    /* Worked-solution layout (4-phase method) */
    .solution-details { margin-top: 24px; border: 1px solid var(--accent-border); border-radius: 10px; background: var(--bg-surface); overflow: hidden; }
    .solution-details[open] { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
    .solution-summary { padding: 12px 18px; background: var(--accent-soft); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 0.92rem; color: var(--accent); user-select: none; list-style: none; }
    .solution-summary::-webkit-details-marker { display: none; }
    .summary-hint { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }
    .solution-content { padding: 24px; border-top: 1px solid var(--border-subtle); font-size: 0.95rem; line-height: 1.7; }
    .solution-content p, .enunciado-box p { margin-bottom: 10px; }
    .phase-block { margin-bottom: 26px; padding-bottom: 18px; border-bottom: 1px dashed var(--border-subtle); }
    .phase-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .phase-badge { display: inline-block; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--accent); background: var(--bg-subtle); border: 1px solid var(--accent-border); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .phase-heading { font-family: var(--font-sans); font-size: 1.05rem; font-weight: 700; letter-spacing: 0; color: var(--text-heading); margin: 6px 0 12px; }
    .step-heading { font-family: var(--font-sans); font-size: 0.95rem; font-weight: 700; color: var(--accent); margin: 20px 0 8px; }
    .math-block { overflow-x: auto; padding: 10px 14px; margin: 10px 0; background: var(--bg-subtle); border-radius: 8px; border: 1px solid var(--border-subtle); text-align: center; }
    .justification-box { background: var(--bg-subtle); border-left: 3px solid var(--accent); padding: 10px 14px; margin: 12px 0; border-radius: 0 6px 6px 0; font-size: 0.92rem; }
    .justification-box > strong, .result-box > strong, .note-box > strong { display: block; margin-bottom: 4px; }
    .source-line { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; }
    .table-wrap { overflow-x: auto; margin: 12px 0; }
    table.data-table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    table.data-table th, table.data-table td { border: 1px solid var(--border-subtle); padding: 6px 10px; text-align: left; }
    table.data-table th { background: var(--bg-subtle); color: var(--text-heading); }

    @media (max-width: 640px) {
      .problem-card {
        padding: 20px 16px;
      }
      .enunciado-box {
        padding: 14px 14px;
      }
    }
  </style>
  <!-- Celestial Sky & Aerospace Glassmorphism System -->

  <link rel="stylesheet" href="../../../assets/css/study-surface.css">
  <script src="../../../assets/js/theme.js"></script>
  <script defer src="../../../assets/js/ask-ai.js"></script>
  <script defer src="../../../assets/js/pdf-export.js"></script>

</head>
