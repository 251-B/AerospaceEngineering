<!DOCTYPE html>
<html lang="en" data-theme="dark" data-celestial-subject="advanced-maths">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  
  <!-- Google Fonts: Abril Fatface, Newsreader, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  
  <!-- KaTeX CDN for Automatic Mathematical Typesetting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false
          });"></script>

  <!-- Celestial Sky & Aerospace Glassmorphism System -->
  <link rel="stylesheet" href="../../../assets/css/celestial-sky.css">
  <link rel="stylesheet" href="../../../assets/css/study-surface.css">

  <style>
    /* ========================================================
       CSS VARIABLES & THEME SYSTEM
       ======================================================== */
    :root {
      --font-display: 'Abril Fatface', cursive, Georgia, serif;
      --font-body: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;

      /* Subject Accent: Advanced Mathematics (Indigo #6366f1) */
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --accent-border: rgba(99, 102, 241, 0.28);
      --accent-glow: rgba(99, 102, 241, 0.18);

      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    [data-theme="dark"] {
      --bg-primary: #070b14;
      --bg-surface: #0f172a;
      --bg-subtle: #1e293b;
      --bg-card: rgba(15, 23, 42, 0.78);
      --bg-card-hover: rgba(20, 30, 55, 0.92);
      --bg-glass: rgba(255, 255, 255, 0.04);
      --bg-input: rgba(255, 255, 255, 0.06);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-card: rgba(255, 255, 255, 0.12);
      --text-heading: #f8fafc;
      --text-body: #cbd5e1;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.45);
      background-color: #030712;
      background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.94);
      --bg-card-hover: rgba(255, 255, 255, 0.98);
      --bg-glass: rgba(0, 0, 0, 0.02);
      --bg-input: rgba(0, 0, 0, 0.04);
      --border-subtle: #e2e8f0;
      --border-card: #cbd5e1;
      --text-heading: #0f172a;
      --text-body: #334155;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06);
      background-color: #f8fafc;
      background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-body);
      font-family: var(--font-sans);
      font-size: 15.5px;
      line-height: 1.75;
      min-height: 100vh;
      transition: background-color var(--transition), color var(--transition);
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      top: -120px;
      right: 12%;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.09) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========================================================
       TOP HEADER
       ======================================================== */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--accent-border);
      letter-spacing: 0.5px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      transition: all var(--transition);
    }

    .back-link:hover {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .theme-toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      position: relative;
      transition: background var(--transition);
      display: flex;
      align-items: center;
      padding: 0 3px;
    }

    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transition: transform var(--transition);
    }

    [data-theme="light"] .theme-toggle::after {
      transform: translateX(20px);
    }

    /* ========================================================
       ARTICLE LAYOUT & PROBLEMS CONTAINER
       ======================================================== */
    .article-container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 36px 24px 80px;
      position: relative;
      z-index: 1;
    }

    .article-header {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .article-meta-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .topic-pill {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 12px;
      border-radius: 6px;
      border: 1px solid var(--accent-border);
    }

    .course-tag {
      font-size: 13px;
      color: var(--text-muted);
    }

    h1.article-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 2.7rem);
      font-weight: 700;
      color: var(--text-heading);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .article-lead {
      font-size: 1.08rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .source-box {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--accent-border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-light);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* ========================================================
       PROBLEM CARDS & 4-PHASE ARCHITECTURE
       ======================================================== */
    .problem-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 32px 36px;
      margin-bottom: 48px;
      box-shadow: var(--shadow-card);
      scroll-margin-top: 110px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .problem-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .problem-title-group {
      flex: 1;
    }

    .problem-num-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    h2.problem-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-heading);
      line-height: 1.3;
    }

    .problem-meta-badge {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      background: var(--bg-input);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    /* Phase Containers */
    .phase-section {
      margin-top: 26px;
    }

    .phase-badge-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .phase-1-badge { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .phase-2-badge { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .phase-3-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .phase-4-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    .problem-statement-box {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 18px 22px;
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-heading);
      margin-bottom: 16px;
    }

    .math-block {
      overflow-x: auto;
      padding: 14px 18px;
      margin: 16px 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-sm);
      text-align: center;
    }

    .sub-case-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      margin: 16px 0;
    }

    .sub-case-header {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-light);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-box {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10b981;
      border-radius: var(--radius-sm);
      padding: 18px 22px;
      margin: 18px 0;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.05);
    }

    .result-box-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #10b981;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .note-box {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin: 18px 0;
      font-size: 0.94rem;
    }

    .note-box-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .warning-box {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #f59e0b;
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin: 18px 0;
      font-size: 0.94rem;
    }

    .warning-box-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #f59e0b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Structured Tables */
    .table-container {
      overflow-x: auto;
      margin: 18px 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-card);
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    table.data-table th {
      background: var(--bg-surface);
      color: var(--text-heading);
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 2px solid var(--accent);
      white-space: nowrap;
    }

    table.data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    table.data-table tr:last-child td {
      border-bottom: none;
    }

    table.data-table tr:hover td {
      background: var(--accent-soft);
    }

    /* Bottom Navigation */
    .article-nav {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 60px;
      padding-top: 28px;
      border-top: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      flex-direction: column;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      transition: all var(--transition);
      min-width: 240px;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    .nav-btn-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .nav-btn-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-heading);
    }

    footer.site-footer {
      margin-top: 60px;
      padding: 36px 0;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    @media (max-width: 680px) {
      .problem-card { padding: 22px 20px; }
    }

    /* Problem-sheet additions: step headings, bullet lists, figures */
    h4.step-heading { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.4px; color: var(--accent-light); margin: 18px 0 6px; }
    .problem-card p { margin: 8px 0; }
    .problem-card ul.bullet-list, .problem-card ol.num-list { margin: 8px 0 8px 22px; }
    .problem-card li { margin: 4px 0; }
    .math-block { overflow-x: auto; }
    .sub-case-card p { overflow-wrap: break-word; }
    .katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
    [data-theme="dark"] { --text-faint: #7c8aa0; }
    [data-theme="light"] { --text-faint: #8a94a6; }
    .diagram-card { background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 12px; padding: 16px; margin: 18px 0; text-align: center; }
    .diagram-scroll svg { max-width: 360px; width: 100%; height: auto; display: block; margin: 0 auto; }
    .diagram-caption { font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; text-align: center; }
    .diagram-open { display: inline-block; font-family: var(--font-mono); font-size: 0.75rem; margin-top: 6px; color: var(--accent); }
    .diagram-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .diagram-row .diagram-card { flex: 1 1 280px; max-width: 420px; margin: 10px 0; }
    @media print { .diagram-open { display: none !important; } }
    .diagram-card svg text tspan { text-decoration-thickness: 1px; }
  </style>
  <script src="../../../assets/js/theme.js"></script>
  <script defer src="../../../assets/js/ask-ai.js"></script>
  <script defer src="../../../assets/js/pdf-export.js"></script>
  <link rel="stylesheet" href="../../../assets/css/responsive.css">
  <style>
    a.end-btn.end-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px;
      background: var(--bg-card, var(--bg-surface)); border: 1px solid var(--border-card, var(--border-subtle));
      color: var(--text-heading); text-decoration: none; font-weight: 500; transition: all var(--transition); }
    a.end-btn.end-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text-heading); }
  </style>
  <link rel="stylesheet" href="../../../assets/css/source-links.css" data-srclink>
</head>
