<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" class="fig-kit" style="max-width:560px;margin:0 auto;display:block" role="img" aria-label="Layout of the balance sheet">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<text x="140.0" y="20.0" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">ASSETS</text>
<text x="420.0" y="20.0" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">LIABILITIES AND EQUITY</text>
<rect x="30.0" y="30.0" width="220.0" height="140.0" rx="2" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.4"/>
<text x="140.0" y="80.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Non-current assets</text>
<text x="140.0" y="96.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">the remainder: long-term</text>
<text x="140.0" y="112.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">investments, land, building,</text>
<text x="140.0" y="128.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">equipment, patents</text>
<rect x="30.0" y="170.0" width="220.0" height="110.0" rx="2" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.4"/>
<text x="140.0" y="213.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Current assets</text>
<text x="140.0" y="229.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">used or turned into cash</text>
<text x="140.0" y="245.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">within one year</text>
<rect x="310.0" y="30.0" width="220.0" height="100.0" rx="2" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="420.0" y="68.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Stockholders' equity</text>
<text x="420.0" y="84.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">contributed capital</text>
<text x="420.0" y="100.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">+ retained earnings</text>
<rect x="310.0" y="130.0" width="220.0" height="70.0" rx="2" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="420.0" y="161.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Long-term liabilities</text>
<text x="420.0" y="177.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">not due within the year</text>
<rect x="310.0" y="200.0" width="220.0" height="80.0" rx="2" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="420.0" y="228.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Current liabilities</text>
<text x="420.0" y="244.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">paid or satisfied</text>
<text x="420.0" y="260.2" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">within the coming year</text>
<text x="280.0" y="160.0" fill="#4b5563" font-size="26" font-weight="700" text-anchor="middle">=</text>
</g></svg>