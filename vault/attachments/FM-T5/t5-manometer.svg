<text x="440.0" y="146.0" fill="#3b82f6" font-size="14" font-weight="400" text-anchor="start" font-family="Newsreader, Georgia, 'Times New Roman', serif">down h₁ in ρ:  + ρg h₁</text>
<text x="440.0" y="170.0" fill="#ec4899" font-size="14" font-weight="400" text-anchor="start" font-family="Newsreader, Georgia, 'Times New Roman', serif">up h₂ in ρₘ:  − ρₘg h₂</text>
<text x="440.0" y="194.0" fill="#4b5563" font-size="14" font-weight="400" text-anchor="start" font-family="Newsreader, Georgia, 'Times New Roman', serif">arrive at the level: pₐ</text>
