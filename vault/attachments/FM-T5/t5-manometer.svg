<text x="250.0" y="260.0" fill="#ec4899" font-size="17" font-weight="400" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-style="italic">ρ<tspan baseline-shift="sub" font-size="72%">m</tspan></text>
<line x1="188.0" y1="200.0" x2="322.0" y2="200.0" stroke="#8a94a6" stroke-width="0.8" stroke-dasharray="3,3"/>
