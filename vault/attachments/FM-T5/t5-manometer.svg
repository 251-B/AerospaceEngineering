<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 657 330" width="100%" class="fig-kit" style="max-width:657px;margin:0 auto;display:block" role="img" aria-label="U-tube manometer: pipe at pressure p_A filled with a liquid of density rho, manometric liquid rho_m, column h_1 from A down to the interface and difference of levels h_2 in the two branches, right branch open to p_a">
