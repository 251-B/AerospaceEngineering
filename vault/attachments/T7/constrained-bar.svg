<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" class="fig-kit" style="max-width:700px;margin:0 auto;display:block" role="img" aria-label="Thermal stress in a bar between two rigid walls">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<text x="180.0" y="28.0" fill="#4b5563" font-size="14" font-weight="700" text-anchor="middle">Heating: T<tspan baseline-shift="sub" font-size="72%">f</tspan> &gt; T<tspan baseline-shift="sub" font-size="72%">0</tspan></text>
<rect x="30.0" y="60.0" width="26.0" height="130.0" fill="#8a94a6" fill-opacity="0.35" stroke="#8a94a6" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="304.0" y="60.0" width="26.0" height="130.0" fill="#8a94a6" fill-opacity="0.35" stroke="#8a94a6" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="56.0" y="105.0" width="248.0" height="40.0" fill="#f59e0b" fill-opacity="0.25" stroke="#4b5563" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="60.0" y1="125.0" x2="99.0" y2="125.0" stroke="#ec4899" stroke-width="2.6"/>
<path d="M105.0,125.0 L95.8,128.9 L95.8,121.1 Z" fill="#ec4899"/>
<line x1="300.0" y1="125.0" x2="261.0" y2="125.0" stroke="#ec4899" stroke-width="2.6"/>
<path d="M255.0,125.0 L264.2,121.1 L264.2,128.9 Z" fill="#ec4899"/>
<text x="180.0" y="80.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">wall forces push on the bar</text>
<text x="180.0" y="232.0" fill="#ec4899" font-size="14" font-weight="700" text-anchor="middle">compressive stress, σ &lt; 0</text>
<text x="520.0" y="28.0" fill="#4b5563" font-size="14" font-weight="700" text-anchor="middle">Cooling: T<tspan baseline-shift="sub" font-size="72%">f</tspan> &lt; T<tspan baseline-shift="sub" font-size="72%">0</tspan></text>
<rect x="370.0" y="60.0" width="26.0" height="130.0" fill="#8a94a6" fill-opacity="0.35" stroke="#8a94a6" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="644.0" y="60.0" width="26.0" height="130.0" fill="#8a94a6" fill-opacity="0.35" stroke="#8a94a6" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="396.0" y="105.0" width="248.0" height="40.0" fill="#f59e0b" fill-opacity="0.25" stroke="#4b5563" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="445.0" y1="125.0" x2="406.0" y2="125.0" stroke="#3b82f6" stroke-width="2.6"/>
<path d="M400.0,125.0 L409.2,121.1 L409.2,128.9 Z" fill="#3b82f6"/>
<line x1="595.0" y1="125.0" x2="634.0" y2="125.0" stroke="#3b82f6" stroke-width="2.6"/>
<path d="M640.0,125.0 L630.8,128.9 L630.8,121.1 Z" fill="#3b82f6"/>
<text x="520.0" y="80.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">wall forces pull on the bar</text>
<text x="520.0" y="232.0" fill="#3b82f6" font-size="14" font-weight="700" text-anchor="middle">tensile stress, σ &gt; 0</text>
<text x="350.0" y="270.0" fill="#4b5563" font-size="14" font-weight="700" text-anchor="middle">σ = E α (T<tspan baseline-shift="sub" font-size="72%">0</tspan> − T<tspan baseline-shift="sub" font-size="72%">f</tspan>) = E α ΔT   (bar held at constant length)</text>
</g></svg>