<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 731 330" width="100%" class="fig-kit" style="max-width:731px;margin:0 auto;display:block" role="img" aria-label="Heat flux through a bar (Fourier's law)">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<rect x="120.0" y="70.0" width="380.0" height="70.0" fill="#f59e0b" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.8" stroke-linejoin="round"/>
<text x="100.0" y="110.0" fill="#ec4899" font-size="12" font-weight="700" text-anchor="end">hot end</text>
<text x="520.0" y="110.0" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="start">cold end</text>
<line x1="160.0" y1="105.0" x2="452.8" y2="105.0" stroke="#ec4899" stroke-width="2.8"/>
<path d="M460.0,105.0 L448.9,109.7 L448.9,100.3 Z" fill="#ec4899"/>
<text x="310.0" y="96.0" fill="#ec4899" font-size="14" font-weight="700" text-anchor="middle">q = Q / A</text>
<line x1="160.0" y1="170.0" x2="460.0" y2="170.0" stroke="#6b7280" stroke-width="1.1"/>
<path d="M160.0,170.0 L166.4,167.3 L166.4,172.7 Z" fill="#6b7280"/>
<path d="M460.0,170.0 L453.6,172.7 L453.6,167.3 Z" fill="#6b7280"/>
<text x="310.0" y="188.0" fill="#6b7280" font-size="14" font-weight="400" text-anchor="middle">Δx</text>
<text x="140.0" y="62.0" fill="#ec4899" font-size="13" font-weight="700" text-anchor="middle">T<tspan baseline-shift="sub" font-size="72%">hot</tspan></text>
<text x="480.0" y="62.0" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">T<tspan baseline-shift="sub" font-size="72%">cold</tspan></text>
<text x="310.0" y="214.0" fill="#4b5563" font-size="16" font-weight="700" text-anchor="middle">q = −k ΔT / Δx</text>
<text x="310.0" y="234.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">heat flows towards the cold end, down the temperature gradient</text>
<rect x="40.0" y="262.0" width="250.0" height="46.0" rx="6" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round"/>
<text x="165.0" y="290.0" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">free electrons: k<tspan baseline-shift="sub" font-size="72%">e</tspan></text>
<rect x="330.0" y="262.0" width="250.0" height="46.0" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/>
<text x="455.0" y="290.0" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">lattice vibrations (phonons): k<tspan baseline-shift="sub" font-size="72%">ph</tspan></text>
<text x="605.0" y="280.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="start">k = k<tspan baseline-shift="sub" font-size="72%">e</tspan> + k<tspan baseline-shift="sub" font-size="72%">ph</tspan></text>
</g></svg>