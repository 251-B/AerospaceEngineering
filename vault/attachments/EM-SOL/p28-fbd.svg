<text x="556.2" y="257.3" fill="#6b7280" font-size="14" font-weight="400" text-anchor="start" font-family="Newsreader, 'Times New Roman', Times, serif" style="font-variant-numeric:lining-nums">weight + inertia force = −m g_e k</text>
<text x="556.2" y="290.9" fill="#6b7280" font-size="14" font-weight="400" text-anchor="start" font-family="Newsreader, 'Times New Roman', Times, serif" style="font-variant-numeric:lining-nums">g_e = g − a ω² sin ωt</text>
