<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 599 250" width="100%" class="fig-kit" style="max-width:599px;margin:0 auto;display:block" role="img" aria-label="Round aluminium alloy specimen before the test, with a diameter of 8.00 mm and gauge marks 40.00 mm apart, and the two halves fitted together after fracture, with the gauge marks 45.60 mm apart and a neck of 6.10 mm diameter">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<rect x="70.0" y="40.0" width="400.0" height="32.0" fill="#8a94a6" fill-opacity="0.15" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="150.0" y1="32.0" x2="150.0" y2="80.0" stroke="#3b82f6" stroke-width="1.6"/>
<line x1="390.0" y1="32.0" x2="390.0" y2="80.0" stroke="#3b82f6" stroke-width="1.6"/>
<line x1="150.0" y1="24.0" x2="390.0" y2="24.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="270.0" y="18.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">l<tspan baseline-shift="sub" font-size="72%">0</tspan> = 40.00 mm</text>
<line x1="488.0" y1="40.0" x2="488.0" y2="72.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="496.0" y="60.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">d<tspan baseline-shift="sub" font-size="72%">0</tspan> = 8.00 mm</text>
<text x="70.0" y="96.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="start">before the test</text>
<path d="M50,160 L256,160 Q286,161 294,165 L294,187 Q286,191 256,192 L50,192 Z" fill="#8a94a6" fill-opacity="0.15" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M298,165 Q306,161 336,160 L520,160 L520,192 L336,192 Q306,191 298,187 Z" fill="#8a94a6" fill-opacity="0.15" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="130.0" y1="152.0" x2="130.0" y2="200.0" stroke="#3b82f6" stroke-width="1.6"/>
<line x1="434.0" y1="152.0" x2="434.0" y2="200.0" stroke="#3b82f6" stroke-width="1.6"/>
<line x1="130.0" y1="144.0" x2="434.0" y2="144.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="220.0" y="138.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">l<tspan baseline-shift="sub" font-size="72%">f</tspan> = 45.60 mm</text>
<line x1="296.0" y1="165.0" x2="296.0" y2="187.0" stroke="#ec4899" stroke-width="1.4"/>
<line x1="296.0" y1="187.0" x2="326.0" y2="222.0" stroke="#ec4899" stroke-width="1.0"/>
<text x="330.0" y="228.0" fill="#ec4899" font-size="12" font-weight="400" text-anchor="start">neck: d<tspan baseline-shift="sub" font-size="72%">f</tspan> = 6.10 mm</text>
<text x="50.0" y="216.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="start">after fracture</text>
</g></svg>