<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="100%" class="fig-kit" style="max-width:480px;margin:0 auto;display:block" role="img" aria-label="ln σ against 1/T for two n-type semiconductors A and B with the same donor concentration: A leaves the flat range at a higher temperature and its high-temperature line is steeper than that of B">
