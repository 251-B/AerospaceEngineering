<path d="M310.0,300.0 L315.7,293.0 L319.0,299.2 Z" fill="#8a94a6"/>
<rect x="464.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="534.0" y="226.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">To sell the</text>
<text x="534.0" y="240.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">mentioned rights</text>
<line x1="310.0" y1="166.0" x2="534.0" y2="200.0" stroke="#8a94a6" stroke-width="1.4"/>
