<text x="90.0" y="226.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">To receive the residual</text>
<text x="90.0" y="240.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">income or surplus</text>
<line x1="310.0" y1="166.0" x2="90.0" y2="200.0" stroke="#8a94a6" stroke-width="1.4"/>
<path d="M90.0,200.0 L97.7,195.3 L98.7,202.2 Z" fill="#8a94a6"/>
<line x1="90.0" y1="260.0" x2="310.0" y2="300.0" stroke="#8a94a6" stroke-width="1.2"/>
<path d="M310.0,300.0 L301.2,302.0 L302.5,295.1 Z" fill="#8a94a6"/>
<rect x="168.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="238.0" y="226.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">To control and reassign the</text>
<text x="238.0" y="240.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">other factors of production</text>
<line x1="310.0" y1="166.0" x2="238.0" y2="200.0" stroke="#8a94a6" stroke-width="1.4"/>
<path d="M238.0,200.0 L244.0,193.3 L247.0,199.6 Z" fill="#8a94a6"/>
<line x1="238.0" y1="260.0" x2="310.0" y2="300.0" stroke="#8a94a6" stroke-width="1.2"/>
<path d="M310.0,300.0 L301.1,299.0 L304.5,292.9 Z" fill="#8a94a6"/>
<rect x="316.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="386.0" y="219.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">To be the central party</text>
<text x="386.0" y="233.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">in all the contracts</text>
<text x="386.0" y="247.5" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">with the inputs</text>
<line x1="310.0" y1="166.0" x2="386.0" y2="200.0" stroke="#8a94a6" stroke-width="1.4"/>
<path d="M386.0,200.0 L377.0,199.8 L379.9,193.4 Z" fill="#8a94a6"/>
