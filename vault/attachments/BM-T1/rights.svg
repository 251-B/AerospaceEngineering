<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="100%" class="fig-kit" style="max-width:620px;margin:0 auto;display:block" role="img" aria-label="The entrepreneur as holder of rights">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<rect x="170.0" y="10.0" width="280.0" height="36.0" rx="8" fill="#4b5563" fill-opacity="0.10" stroke="#4b5563" stroke-width="1.4"/>
<text x="310.0" y="32.5" fill="#6b7280" font-size="13" font-weight="400" text-anchor="middle">Internal organization = teamwork</text>
<rect x="170.0" y="70.0" width="280.0" height="36.0" rx="8" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.4"/>
<text x="310.0" y="92.5" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Team production requires a CONTROLLER</text>
<rect x="170.0" y="130.0" width="280.0" height="36.0" rx="8" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="1.4"/>
<text x="310.0" y="152.6" fill="#6b7280" font-size="13" font-weight="400" text-anchor="middle">Incentive for this task?</text>
<line x1="310.0" y1="46.0" x2="310.0" y2="70.0" stroke="#8a94a6" stroke-width="2"/>
<path d="M310.0,70.0 L306.5,61.7 L313.5,61.7 Z" fill="#8a94a6"/>
