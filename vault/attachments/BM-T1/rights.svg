<path d="M310.0,300.0 L317.5,295.1 L318.8,302.0 Z" fill="#8a94a6"/>
<rect x="130.0" y="300.0" width="360.0" height="40.0" rx="8" fill="#4b5563" fill-opacity="0.10" stroke="#4b5563" stroke-width="1.4"/>
<text x="310.0" y="324.6" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">The entrepreneur holds all these rights</text>
</g></svg>