<text x="100.0" y="293.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">(Na, Al, Cu)</text>
<rect x="215.0" y="140.0" width="120.0" height="110.0" fill="#f59e0b" fill-opacity="0.45" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="215.0" y="70.0" width="120.0" height="95.0" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round"/>
