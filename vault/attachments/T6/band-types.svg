<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 340" width="100%" class="fig-kit" style="max-width:710px;margin:0 auto;display:block" role="img" aria-label="Band structure of metals, semiconductors and insulators">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<line x1="14.0" y1="260.0" x2="14.0" y2="45.4" stroke="#8a94a6" stroke-width="1.4"/>
