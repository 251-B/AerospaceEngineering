<text x="628.0" y="154.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="start">E<tspan baseline-shift="sub" font-size="72%">g</tspan> &gt; 2 eV</text>
<text x="620.0" y="80.0" fill="#6b7280" font-size="11" font-weight="400" text-anchor="middle">conduction band</text>
