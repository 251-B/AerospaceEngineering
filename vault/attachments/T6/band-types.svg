<text x="275.0" y="28.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Metal</text>
<text x="450.0" y="28.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Semiconductor</text>
<text x="620.0" y="28.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Insulator</text>
