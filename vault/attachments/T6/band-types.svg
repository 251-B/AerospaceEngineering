<text x="450.0" y="275.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">Si: 1.1 eV</text>
<text x="450.0" y="293.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">Ge: 0.67 eV</text>
