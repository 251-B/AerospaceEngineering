<text x="275.0" y="293.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">(Mg)</text>
<rect x="390.0" y="50.0" width="120.0" height="80.0" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round"/>
