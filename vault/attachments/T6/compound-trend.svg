<text x="148.0" y="140.0" fill="#f59e0b" font-size="12" font-weight="400" text-anchor="start">atom size increases</text>
<rect x="30.0" y="164.0" width="210.0" height="46.0" rx="6" fill="#f59e0b" fill-opacity="0.25" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round"/>
<text x="135.0" y="192.0" fill="#4b5563" font-size="14" font-weight="700" text-anchor="middle">Ge    E<tspan baseline-shift="sub" font-size="72%">g</tspan> = 0.67 eV</text>
<text x="135.0" y="236.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">E<tspan baseline-shift="sub" font-size="72%">g</tspan> decreases, σ increases</text>
<text x="135.0" y="42.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Group 14, covalent bonds</text>
<line x1="500.0" y1="78.0" x2="307.2" y2="78.0" stroke="#10b981" stroke-width="3.0"/>
<path d="M300.0,78.0 L311.1,73.3 L311.1,82.7 Z" fill="#10b981"/>
