<path d="M680.0,78.0 L668.9,82.7 L668.9,73.3 Z" fill="#ec4899"/>
<text x="300.0" y="66.0" fill="#10b981" font-size="13" font-weight="700" text-anchor="start">more covalent</text>
<text x="680.0" y="66.0" fill="#ec4899" font-size="13" font-weight="700" text-anchor="end">more ionic</text>
<rect x="300.0" y="100.0" width="120.0" height="52.0" rx="6" fill="#f59e0b" fill-opacity="0.18" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round"/>
<text x="360.0" y="122.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">Group 14</text>
<text x="360.0" y="141.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Si, Ge</text>
<rect x="430.0" y="100.0" width="120.0" height="52.0" rx="6" fill="#f59e0b" fill-opacity="0.18" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round"/>
<text x="490.0" y="122.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">Groups 13-15</text>
<text x="490.0" y="141.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">GaAs, InSb</text>
<rect x="560.0" y="100.0" width="120.0" height="52.0" rx="6" fill="#f59e0b" fill-opacity="0.18" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round"/>
<text x="620.0" y="122.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">Groups 12-16</text>
<text x="620.0" y="141.0" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">CdS, ZnTe</text>
<line x1="300.0" y1="196.0" x2="673.4" y2="196.0" stroke="#3b82f6" stroke-width="2.4"/>
<path d="M680.0,196.0 L669.9,200.3 L669.9,191.7 Z" fill="#3b82f6"/>
<text x="490.0" y="186.0" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">E<tspan baseline-shift="sub" font-size="72%">g</tspan> increases</text>
<line x1="300.0" y1="250.0" x2="673.4" y2="250.0" stroke="#ec4899" stroke-width="2.4"/>
