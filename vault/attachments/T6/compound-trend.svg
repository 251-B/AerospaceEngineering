<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" class="fig-kit" style="max-width:700px;margin:0 auto;display:block" role="img" aria-label="Band gap trends in intrinsic semiconductors">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<rect x="30.0" y="60.0" width="210.0" height="46.0" rx="6" fill="#f59e0b" fill-opacity="0.25" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round"/>
<text x="135.0" y="88.0" fill="#4b5563" font-size="14" font-weight="700" text-anchor="middle">Si    E<tspan baseline-shift="sub" font-size="72%">g</tspan> = 1.1 eV</text>
<line x1="135.0" y1="112.0" x2="135.0" y2="151.4" stroke="#f59e0b" stroke-width="2.4"/>
