<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" class="fig-kit" style="max-width:520px;margin:0 auto;display:block" role="img" aria-label="Flexible versus rigid production">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<line x1="60.0" y1="260.0" x2="480.0" y2="260.0" stroke="#8a94a6" stroke-width="1.4"/>
<path d="M480.0,260.0 L471.7,263.5 L471.7,256.5 Z" fill="#8a94a6"/>
<line x1="60.0" y1="270.0" x2="60.0" y2="20.0" stroke="#8a94a6" stroke-width="1.4"/>
<path d="M60.0,20.0 L63.5,28.3 L56.5,28.3 Z" fill="#8a94a6"/>
<text x="480.0" y="278.0" fill="#4b5563" font-size="12" font-weight="400" text-anchor="end">Volume of production</text>
<text x="66.0" y="24.0" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">Total cost</text>
<line x1="60.0" y1="210.0" x2="430.0" y2="60.0" stroke="#ec4899" stroke-width="2.2"/>
<line x1="60.0" y1="150.0" x2="430.0" y2="95.0" stroke="#3b82f6" stroke-width="2.2"/>
<text x="436.0" y="58.0" fill="#ec4899" font-size="12" font-weight="700" text-anchor="start">flexible</text>
<text x="436.0" y="99.0" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="start">rigid</text>
<line x1="293.7" y1="115.3" x2="293.7" y2="260.0" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4 3"/>
<text x="293.7" y="278.0" fill="#6b7280" font-size="12" font-weight="400" text-anchor="middle">crossing volume</text>
<text x="120.0" y="200.0" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">A: flexible cheaper</text>
<text x="330.0" y="140.0" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">B: rigid cheaper</text>
