<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" class="fig-kit" style="max-width:560px;margin:0 auto;display:block" role="img" aria-label="The management pyramid">
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#8a94a6">
<polygon points="150.0,15.0 280.0,235.0 20.0,235.0" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="20.0" y1="85.0" x2="300.0" y2="85.0" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="20.0" y1="160.0" x2="300.0" y2="160.0" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4 3"/>
<text x="150.0" y="70.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Top management</text>
<text x="150.0" y="130.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Middle management</text>
<text x="150.0" y="200.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Low management</text>
<text x="150.0" y="216.0" fill="#6b7280" font-size="11" font-weight="400" text-anchor="middle">(first-line supervisors)</text>
<rect x="330.0" y="40.0" width="100.0" height="40.0" rx="8" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.4"/>
<text x="380.0" y="64.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Strategic</text>
<rect x="440.0" y="40.0" width="100.0" height="40.0" rx="8" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="490.0" y="64.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">General</text>
<rect x="330.0" y="150.0" width="100.0" height="40.0" rx="8" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.4"/>
<text x="380.0" y="174.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Tactical</text>
<rect x="440.0" y="150.0" width="100.0" height="40.0" rx="8" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="1.4"/>
<text x="490.0" y="174.2" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Functional</text>
<text x="435.0" y="20.0" fill="#4b5563" font-size="12" font-weight="700" text-anchor="middle">Scope of activities</text>
</g></svg>